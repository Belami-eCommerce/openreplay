    environment: {}  # Fallback empty environment if env_file is missing

    # managed-healthcheck (added by or-add-healthcheck.sh)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --timeout=3 http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  
  
  sink-openreplay:
