    restart: unless-stopped
  caddy:
    image: caddy:latest
    container_name: caddy-sandbox
    ports:
    - 127.0.0.1:9080:80
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile
    - caddy_data:/data
    - caddy_config:/config
    networks:
    - openreplay-net
    environment:
    - ACME_AGREE=true
    - CADDY_DOMAIN=replays-sandbox.belamiecommerce.com
    restart: unless-stopped
volumes:
