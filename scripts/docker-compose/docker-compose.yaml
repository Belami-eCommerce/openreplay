version: '3'
services:
  postgresql:
    image: ghcr.io/openreplay/postgres:17
    container_name: postgres-sandbox
    volumes:
    - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
        - postgresql.db.svc.cluster.local
    environment:
      POSTGRESQL_PASSWORD: 11b33d76836070b7cc18
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    container_name: clickhouse-sandbox
    volumes:
    - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
        - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
  redis:
    image: ghcr.io/openreplay/valkey:8
    container_name: redis-sandbox
    volumes:
    - redisdata:/data
    networks:
      openreplay-net:
        aliases:
        - redis-master.db.svc.cluster.local
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
  minio:
    image: ghcr.io/openreplay/minio:2025
    container_name: minio-sandbox
    volumes:
    - miniodata:/bitnami/minio/data
    networks:
      openreplay-net:
        aliases:
        - minio.db.svc.cluster.local
    environment:
      MINIO_ROOT_USER: e04a3c5e642d333e9cbc
      MINIO_ROOT_PASSWORD: 80bb33c0b907172b30e0
  fs-permission:
    image: debian:stable-slim
    container_name: fs-permission-sandbox
    profiles:
    - migration
    volumes:
    - shared-volume:/mnt/efs
    - miniodata:/mnt/minio
    - pgdata:/mnt/postgres
    entrypoint:
    - /bin/bash
    - -c
    - 'chown -R 1001:1001 /mnt/{efs,minio,postgres}

      '
    restart: on-failure
  minio-migration:
    image: ghcr.io/openreplay/minio:2025
    container_name: minio-migration-sandbox
    profiles:
    - migration
    depends_on:
    - minio
    - fs-permission
    networks:
    - openreplay-net
    volumes:
    - ../helmcharts/openreplay/files/minio.sh:/tmp/minio.sh
    environment:
      MINIO_HOST: http://minio.db.svc.cluster.local:9000
      MINIO_ACCESS_KEY: e04a3c5e642d333e9cbc
      MINIO_SECRET_KEY: 80bb33c0b907172b30e0
    user: root
    entrypoint:
    - /bin/bash
    - -c
    - "apt update && apt install netcat -y\n# Wait for Minio to be ready\nuntil nc\
      \ -z -v -w30 minio 9000; do\n    echo \"Waiting for Minio server to be ready...\"\
      \n    sleep 1\ndone\nbash /tmp/minio.sh init || exit 100\n"
  db-migration:
    image: ghcr.io/openreplay/postgres:17
    container_name: db-migration-sandbox
    profiles:
    - migration
    depends_on:
    - postgresql
    - minio-migration
    networks:
    - openreplay-net
    volumes:
    - ../schema/db/init_dbs/postgresql/init_schema.sql:/tmp/init_schema.sql
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: 11b33d76836070b7cc18
    entrypoint:
    - /bin/bash
    - -c
    - 'until psql -c ''\q''; do

      echo "PostgreSQL is unavailable - sleeping"

      sleep 1

      done

      echo "PostgreSQL is up - executing command"

      psql -v ON_ERROR_STOP=1 -f /tmp/init_schema.sql

      '
  clickhouse-migration:
    image: clickhouse/clickhouse-server:25.11-alpine
    container_name: clickhouse-migration-sandbox
    profiles:
    - migration
    depends_on:
    - clickhouse
    - minio-migration
    networks:
    - openreplay-net
    volumes:
    - ../schema/db/init_dbs/clickhouse/create/init_schema.sql:/tmp/init_schema.sql
    environment:
      CH_HOST: clickhouse-openreplay-clickhouse.db.svc.cluster.local
      CH_PORT: '9000'
      CH_PORT_HTTP: '8123'
      CH_USERNAME: default
      CH_PASSWORD: ''
    entrypoint:
    - /bin/bash
    - -c
    - "# Checking variable is empty. Shell independant method.\n# Wait for Minio to\
      \ be ready\nuntil nc -z -v -w30 clickhouse-openreplay-clickhouse.db.svc.cluster.local\
      \ 9000; do\n    echo \"Waiting for Minio server to be ready...\"\n    sleep\
      \ 1\ndone\n\necho \"clickhouse is up - executing command\"\nclickhouse-client\
      \ -h clickhouse-openreplay-clickhouse.db.svc.cluster.local --user default --port\
      \ 9000 --multiquery < /tmp/init_schema.sql || true\n"
  alerts-openreplay:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.26.0
    domainname: app.svc.cluster.local
    container_name: alerts-sandbox
    networks:
      openreplay-net:
        aliases:
        - alerts-openreplay
        - alerts-openreplay.app.svc.cluster.local
    volumes:
    - shared-volume:/mnt/efs
    env_file:
    - docker-envs/alerts.env
    environment: {}
    restart: unless-stopped
  api-openreplay:
    image: public.ecr.aws/p1t3u8a3/api:v1.26.0
    domainname: app.svc.cluster.local
    container_name: api-sandbox
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      openreplay-net:
        aliases:
        - api-openreplay
        - api-openreplay.app.svc.cluster.local
    volumes:
    - shared-volume:/mnt/efs
    - ./wait-for-pg.sh:/scripts/wait-for-pg.sh:ro
    entrypoint:
    - /bin/sh
    - /scripts/wait-for-pg.sh
    env_file:
    - docker-envs/api.env
    environment: {}
    restart: unless-stopped
  http-openreplay:
    image: public.ecr.aws/p1t3u8a3/http:v1.26.0
    domainname: app.svc.cluster.local
    container_name: http-sandbox
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      openreplay-net:
        aliases:
        - http-openreplay
        - http-openreplay.app.svc.cluster.local
    volumes:
    - shared-volume:/mnt/efs
    - ./wait-for-pg.sh:/scripts/wait-for-pg.sh:ro
    entrypoint:
    - /bin/sh
    - /scripts/wait-for-pg.sh
    env_file:
    - docker-envs/http.env
    environment: {}
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - '-'
      - --timeout=3
      - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  images-openreplay:
    image: public.ecr.aws/p1t3u8a3/images:v1.26.0
    domainname: app.svc.cluster.local
    container_name: images-sandbox
    networks:
      openreplay-net:
        aliases:
        - images-openreplay
        - images-openreplay.app.svc.cluster.local
    volumes:
    - shared-volume:/mnt/efs
    env_file:
    - docker-envs/images.env
    environment: {}
    restart: unless-stopped
  integrations-openreplay:
